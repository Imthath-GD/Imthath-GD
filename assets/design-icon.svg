<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="designGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388BFD"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <!-- Pen / design tool icon -->
  <path d="M20 42 L22 34 L38 18 C39.5 16.5 41.5 16.5 43 18 L46 21 C47.5 22.5 47.5 24.5 46 26 L30 42 L22 44 Z" fill="none" stroke="url(#designGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"/>
  <path d="M35 21 L43 29" stroke="url(#designGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Accent dot -->
  <circle cx="44" cy="20" r="2.5" fill="#00D4FF" opacity="0.9"/>
</svg>
