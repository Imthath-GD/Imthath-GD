<svg xmlns="http://www.w3.org/2000/svg" width="720" height="28" viewBox="0 0 720 28" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#A78BFA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="-0.4 0" to="0.4 0" dur="5s" repeatCount="indefinite"
                        additive="sum"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="14" x2="720" y2="14" stroke="url(#divGrad)" stroke-width="1.5"/>
  <circle cx="360" cy="14" r="3.5" fill="#22D3EE">
    <animate attributeName="r" values="3;4.5;3" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="14" r="7" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.35">
    <animate attributeName="r" values="6;9;6" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
