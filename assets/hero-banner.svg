<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="45%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0A101C"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="65%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="geo1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="geo2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>

  <g opacity="0.07" stroke="#22D3EE" stroke-width="0.6">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1050" y1="0" x2="1050" y2="380"/>
  </g>

  <circle cx="920" cy="110" r="110" fill="url(#orb1)" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="260" r="85" fill="url(#orb2)" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.6;0.95;0.6" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="70" r="50" fill="url(#orb1)" opacity="0.5">
    <animate attributeName="r" values="48;56;48" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(760,45)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 130 85" to="360 130 85"
                        dur="48s" repeatCount="indefinite"/>
      <polygon points="130,15 210,85 130,155 50,85"
               fill="url(#geo1)" stroke="#22D3EE" stroke-width="1.4" opacity="0.75"/>
      <polygon points="130,40 180,85 130,130 80,85"
               fill="none" stroke="#818CF8" stroke-width="1" opacity="0.5"/>
    </g>

    <g opacity="0.85">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -8; 0 0" dur="5s" repeatCount="indefinite"/>
      <rect x="195" y="25" width="85" height="52" rx="6"
            fill="#0F1623" stroke="#22D3EE" stroke-width="1" transform="rotate(10 237 51)"/>
      <rect x="205" y="36" width="55" height="6" rx="2" fill="#22D3EE" opacity="0.45" transform="rotate(10 237 51)"/>
      <rect x="205" y="48" width="38" height="5" rx="2" fill="#64748B" opacity="0.4" transform="rotate(10 237 51)"/>
    </g>

    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 7; 0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="30" y="165" width="75" height="48" rx="6"
            fill="#0F1623" stroke="#A78BFA" stroke-width="1" transform="rotate(-9 67 189)"/>
      <rect x="40" y="176" width="48" height="5" rx="2" fill="#A78BFA" opacity="0.45" transform="rotate(-9 67 189)"/>
      <rect x="40" y="188" width="32" height="5" rx="2" fill="#64748B" opacity="0.35" transform="rotate(-9 67 189)"/>
    </g>

    <g transform="translate(175,155)" opacity="0.65">
      <animateTransform attributeName="transform" type="translate"
                        values="175 155; 175 148; 175 155" dur="7s" repeatCount="indefinite"/>
      <polygon points="40,0 82,22 40,44 0,22" fill="none" stroke="#22D3EE" stroke-width="1.2"/>
      <polygon points="40,22 82,44 40,66 0,44" fill="none" stroke="#818CF8" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="22" stroke="#22D3EE" stroke-width="1"/>
      <line x1="82" y1="22" x2="82" y2="44" stroke="#818CF8" stroke-width="1"/>
      <line x1="0" y1="22" x2="0" y2="44" stroke="#818CF8" stroke-width="1"/>
      <line x1="40" y1="44" x2="40" y2="66" stroke="#22D3EE" stroke-width="1"/>
    </g>

    <line x1="130" y1="85" x2="195" y2="50" stroke="#22D3EE" stroke-width="1" opacity="0.35"/>
    <line x1="130" y1="110" x2="105" y2="175" stroke="#A78BFA" stroke-width="1" opacity="0.3"/>

    <circle cx="255" cy="145" r="2.8" fill="#22D3EE">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="185" r="2" fill="#818CF8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="45" r="2.2" fill="#A78BFA">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="95" r="1.8" fill="#22D3EE" opacity="0.6"/>
    <circle cx="15" cy="125" r="1.8" fill="#818CF8" opacity="0.5"/>

    <path d="M15 230 Q110 185 195 210 T310 185" fill="none" stroke="url(#lineGrad)" stroke-width="1.4" opacity="0.55"/>
  </g>

  <rect x="60" y="92" width="36" height="3" rx="1.5" fill="#22D3EE"/>
  <rect x="100" y="92" width="12" height="3" rx="1.5" fill="#818CF8" opacity="0.75"/>

  <text x="60" y="148"
        font-family="Inter,SF Pro Display,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="50" font-weight="700" fill="url(#nameGrad)" letter-spacing="1.5"
        filter="url(#textGlow)">
    MOHAMED IMTHATH
  </text>

  <text x="60" y="188"
        font-family="Inter,SF Pro Display,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="15" font-weight="500" fill="#22D3EE" letter-spacing="2.8">
    CREATIVE DESIGNER  ·  DIGITAL CREATOR  ·  DEVELOPER
  </text>

  <text x="60" y="235"
        font-family="Inter,SF Pro Display,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
    Turning Imagination Into Digital Experiences.
  </text>

  <rect x="60" y="268" width="380" height="2" fill="url(#lineGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
