<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388BFD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0F6FC"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#388BFD"/>
    </linearGradient>
    
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388BFD" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00D4FF"/>
      <stop offset="70%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#388BFD" stop-opacity="0"/>
    </linearGradient>
    
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#388BFD" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#388BFD" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="geoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388BFD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.2"/>
    </linearGradient>
    
    <linearGradient id="geoGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#388BFD" stop-opacity="0.15"/>
    </linearGradient>
    
    <!-- Filters for glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="#388BFD" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="#388BFD" stroke-width="0.5"/>
  </g>
  
  <!-- Ambient orbs / glow effects -->
  <circle cx="950" cy="120" r="120" fill="url(#orbGlow1)" filter="url(#softGlow)"/>
  <circle cx="1050" cy="280" r="90" fill="url(#orbGlow2)" filter="url(#softGlow)"/>
  <circle cx="800" cy="80" r="60" fill="url(#orbGlow1)" opacity="0.5"/>
  
  <!-- Abstract geometric structures - Right side -->
  <!-- Floating glass panels / tech elements -->
  <g transform="translate(780, 60)">
    <!-- Large diamond / geometric shape -->
    <polygon points="140,20 220,80 140,140 60,80" fill="url(#geoGrad)" stroke="#00D4FF" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
    <polygon points="140,40 190,80 140,120 90,80" fill="none" stroke="#388BFD" stroke-width="1" opacity="0.5"/>
    
    <!-- Floating rectangles / cards -->
    <rect x="200" y="30" width="80" height="50" rx="4" fill="#161B22" stroke="#388BFD" stroke-width="1" opacity="0.8" transform="rotate(12 240 55)"/>
    <rect x="210" y="40" width="60" height="8" rx="2" fill="#00D4FF" opacity="0.4" transform="rotate(12 240 55)"/>
    <rect x="210" y="55" width="40" height="6" rx="2" fill="#8B949E" opacity="0.3" transform="rotate(12 240 55)"/>
    
    <rect x="40" y="160" width="70" height="45" rx="4" fill="#161B22" stroke="#A371F7" stroke-width="1" opacity="0.75" transform="rotate(-8 75 182)"/>
    <rect x="50" y="170" width="50" height="6" rx="2" fill="#A371F7" opacity="0.4" transform="rotate(-8 75 182)"/>
    <rect x="50" y="182" width="35" height="5" rx="2" fill="#8B949E" opacity="0.3" transform="rotate(-8 75 182)"/>
    
    <!-- Connecting lines -->
    <line x1="140" y1="80" x2="200" y2="55" stroke="#00D4FF" stroke-width="1" opacity="0.4"/>
    <line x1="140" y1="100" x2="110" y2="170" stroke="#A371F7" stroke-width="1" opacity="0.35"/>
    
    <!-- Small particles / dots -->
    <circle cx="250" cy="140" r="3" fill="#00D4FF" opacity="0.8"/>
    <circle cx="280" cy="180" r="2" fill="#388BFD" opacity="0.6"/>
    <circle cx="50" cy="50" r="2.5" fill="#A371F7" opacity="0.7"/>
    <circle cx="300" cy="90" r="2" fill="#00D4FF" opacity="0.5"/>
    <circle cx="20" cy="120" r="2" fill="#388BFD" opacity="0.5"/>
    
    <!-- Wireframe cube-like structure -->
    <g transform="translate(180, 160)" opacity="0.6">
      <polygon points="40,0 80,20 40,40 0,20" fill="none" stroke="#00D4FF" stroke-width="1.2"/>
      <polygon points="40,20 80,40 40,60 0,40" fill="none" stroke="#388BFD" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="20" stroke="#00D4FF" stroke-width="1"/>
      <line x1="80" y1="20" x2="80" y2="40" stroke="#388BFD" stroke-width="1"/>
      <line x1="0" y1="20" x2="0" y2="40" stroke="#388BFD" stroke-width="1"/>
      <line x1="40" y1="40" x2="40" y2="60" stroke="#00D4FF" stroke-width="1"/>
    </g>
    
    <!-- Abstract arc / curve -->
    <path d="M 20 220 Q 100 180 180 200 T 300 180" fill="none" stroke="url(#accentLine)" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Horizontal accent line under text area -->
  <rect x="60" y="280" width="420" height="2" fill="url(#accentLine)" opacity="0.7"/>
  
  <!-- Left side typography -->
  <!-- Name -->
  <text x="60" y="140" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F0F6FC" letter-spacing="2" filter="url(#textGlow)">
    MOHAMED IMTHATH
  </text>
  
  <!-- Subtitle roles -->
  <text x="60" y="185" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#00D4FF" letter-spacing="3">
    CREATIVE DESIGNER  ·  DIGITAL CREATOR  ·  DEVELOPER
  </text>
  
  <!-- Tagline -->
  <text x="60" y="240" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8B949E" letter-spacing="0.5">
    "Turning Imagination Into Digital Experiences."
  </text>
  
  <!-- Small decorative accent near name -->
  <rect x="60" y="100" width="40" height="3" rx="1.5" fill="#388BFD"/>
  <rect x="105" y="100" width="12" height="3" rx="1.5" fill="#00D4FF" opacity="0.7"/>
</svg>
