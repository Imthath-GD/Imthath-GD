<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#388BFD"/>
    </linearGradient>
    <filter id="devGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <!-- Code brackets -->
  <path d="M22 20 L14 32 L22 44" fill="none" stroke="url(#devGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#devGlow)"/>
  <path d="M42 20 L50 32 L42 44" fill="none" stroke="url(#devGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#devGlow)"/>
  <!-- Slash -->
  <path d="M36 18 L28 46" fill="none" stroke="#00D4FF" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
</svg>
